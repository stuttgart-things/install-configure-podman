---
- name: Update OS Debian + install tools
  block:
    - name: Update OS
      ansible.builtin.apt:
        update_cache: true

    - name: Download and install buildah + skopeo
      ansible.builtin.apt:
        name: "{{ item.value.bin_name }}"
      loop: "{{ lookup('dict', bin, wantlist=True) }}"
  when: ansible_os_family == 'Debian'

- name: Install tools on OS RedHat
  ansible.builtin.yum:
    name: "{{ item.value.bin_name }}"
    state: present
  loop: "{{ lookup('dict', bin, wantlist=True) }}"
  when: ansible_os_family == 'RedHat'
